<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockStart - Begin Your Investing Journey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --concrete-50: #f8f9fa;
        --concrete-100: #e9ecef;
        --concrete-200: #dee2e6;
        --concrete-300: #ced4da;
        --concrete-400: #adb5bd;
        --concrete-500: #6c757d;
        --concrete-600: #495057;
        --concrete-700: #343a40;
        --concrete-800: #212529;
        --concrete-900: #0d0d0d;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --accent-blue: #3b82f6;
        --accent-amber: #f59e0b;
      }
      
      body {
        font-family: 'DM Sans', sans-serif;
        background-color: #0a0a0a;
        color: #e9ecef;
      }
      
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      
      .concrete-grid {
        background-image: 
          linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      
      .concrete-texture {
        position: relative;
      }
      
      .concrete-texture::before {
        content: '';
        position: absolute;
        inset: 0;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.03;
        pointer-events: none;
        z-index: 1;
      }
      
      .glass-panel {
        background: rgba(30, 30, 30, 0.6);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      * {
        scrollbar-width: thin;
        scrollbar-color: #343a40 #0d0d0d;
      }
      
      *::-webkit-scrollbar {
        width: 6px;
      }
      
      *::-webkit-scrollbar-track {
        background: #0d0d0d;
      }
      
      *::-webkit-scrollbar-thumb {
        background: #343a40;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
